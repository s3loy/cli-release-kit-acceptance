name: private Linux compatibility comparison

on:
  push:
    branches: [acceptance/compatibility-20261117]

permissions:
  contents: read

concurrency:
  group: private-compatibility-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 's3loy/cli-release-kit-acceptance' && github.event.repository.private == true
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        runner: [ubuntu-22.04, ubuntu-24.04]
    env:
      RUSTUP_TOOLCHAIN: 1.96.0
      CARGO_TERM_COLOR: never
    steps:
      - name: Check out the exact experiment commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Install the declared minimum Rust toolchain
        run: rustup toolchain install 1.96.0 --profile minimal
      - name: Build, self-package and probe common userspaces
        run: python3 compatibility/run.py --runner '${{ matrix.runner }}' --output "$RUNNER_TEMP/compatibility"
      - name: Preserve private evidence and artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compatibility-${{ matrix.runner }}
          path: |
            ${{ runner.temp }}/compatibility/report/
            ${{ runner.temp }}/compatibility/logs/
            ${{ runner.temp }}/compatibility/packages/
            ${{ runner.temp }}/compatibility/bin/
          if-no-files-found: error
          retention-days: 3
          include-hidden-files: false
  compare:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out the same experiment commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Download this run's private reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: compatibility-ubuntu-*
          path: ${{ runner.temp }}/inputs
          merge-multiple: false
      - name: Compare the actual results
        run: python3 compatibility/compare.py --input "$RUNNER_TEMP/inputs" --output "$RUNNER_TEMP/comparison.json"
      - name: Preserve the comparison
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compatibility-comparison
          path: ${{ runner.temp }}/comparison.json
          if-no-files-found: error
          retention-days: 3
