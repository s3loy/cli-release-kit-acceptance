name: Native SDK curation and test engine bootstrap

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-curation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  capture:
    if: >-
      github.repository == 's3loy/cli-release-kit-acceptance' &&
      github.ref == 'refs/heads/acceptance/cmake-six-platform-20261117'
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          # Targeted repair run; the original four Unix jobs remain in run
          # 44075531111 against the same frozen engine source identity.
          - host: windows-x86_64
            runner: windows-2022
            rust_host: x86_64-pc-windows-msvc
          - host: windows-aarch64
            runner: windows-11-vs2026-arm
            rust_host: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out only this acceptance branch revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Verify frozen inputs, build native test engine, capture candidate identities
        env:
          CURATION_HOST: ${{ matrix.host }}
          CURATION_RUST_HOST: ${{ matrix.rust_host }}
          CURATION_RUNNER_LABEL: ${{ matrix.runner }}
        run: python ci/native-curation/curate.py
      - name: Preserve only identities, logs, and the unreleased test engine
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-curation-${{ matrix.host }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: curation-output/${{ matrix.host }}/
          retention-days: 3
          if-no-files-found: error
