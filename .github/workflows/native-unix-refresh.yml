name: Refresh Unix native engines and SDK records

on:
  workflow_dispatch:
  push:
    branches: [acceptance/cmake-six-platform-20261117]
    paths:
      - .github/workflows/native-unix-refresh.yml
      - ci/native-curation/engine-src/**
      - ci/native-curation/engine-source-files.json

permissions:
  contents: read

concurrency:
  group: native-unix-refresh-${{ github.ref }}
  cancel-in-progress: false

jobs:
  capture:
    if: >-
      github.repository == 's3loy/cli-release-kit-acceptance' &&
      github.ref == 'refs/heads/acceptance/cmake-six-platform-20261117'
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - host: linux-x86_64
            runner: ubuntu-24.04
            rust_host: x86_64-unknown-linux-gnu
          - host: linux-aarch64
            runner: ubuntu-24.04-arm
            rust_host: aarch64-unknown-linux-gnu
          - host: macos-x86_64
            runner: macos-15-intel
            rust_host: x86_64-apple-darwin
          - host: macos-aarch64
            runner: macos-15
            rust_host: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out only this acceptance branch revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Verify frozen inputs, build native test engine, capture candidate identities
        env:
          CURATION_HOST: ${{ matrix.host }}
          CURATION_RUST_HOST: ${{ matrix.rust_host }}
          CURATION_RUNNER_LABEL: ${{ matrix.runner }}
        run: python ci/native-curation/curate.py
      - name: Preserve only identities, logs, and the unreleased test engine
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-curation-${{ matrix.host }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: curation-output/${{ matrix.host }}/
          retention-days: 3
          if-no-files-found: error
