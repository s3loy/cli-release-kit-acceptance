name: Native CLI package acceptance
on:
  push:
    branches: [acceptance/cmake-six-platform-20261117]
    paths:
      - .github/workflows/native-consumer.yml
      - release.toml
      - release-ci.toml
      - native-cmake/**
      - ci/native-consumer/**
      - ci/native-curation/engine-src/**
      - ci/native-curation/engine-source-files.json
permissions:
  contents: read
concurrency:
  group: native-consumer-${{ github.ref }}
  cancel-in-progress: false
jobs:
  candidate:
    if: github.repository == 's3loy/cli-release-kit-acceptance' && github.ref == 'refs/heads/acceptance/cmake-six-platform-20261117'
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - host: linux-x86_64
            runner: ubuntu-24.04
          - host: linux-aarch64
            runner: ubuntu-24.04-arm
          - host: macos-x86_64
            runner: macos-15-intel
          - host: macos-aarch64
            runner: macos-15
          - host: windows-x86_64
            runner: windows-2022
          - host: windows-aarch64
            runner: windows-11-vs2026-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out the exact reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Install the fixed Go planner prerequisite
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.27.4'
          check-latest: false
          cache: false
      - name: Build the engine and run native candidate package checks
        env:
          NATIVE_HOST: ${{ matrix.host }}
        run: python ci/native-consumer/run.py
      - name: Retain candidate packages and bounded diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-consumer-${{ matrix.host }}-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 3
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/relship-native-consumer/acceptance.json
            ${{ runner.temp }}/relship-native-consumer/failure.json
            ${{ runner.temp }}/relship-native-consumer/engine-artifact.json
            ${{ runner.temp }}/relship-native-consumer/plan.json
            ${{ runner.temp }}/relship-native-consumer/logs/**
            ${{ runner.temp }}/relship-native-consumer/job/receipt.json
            ${{ runner.temp }}/relship-native-consumer/job/ci-manifest.json
            ${{ runner.temp }}/relship-native-consumer/job/result/**
            ${{ runner.temp }}/relship-native-consumer/job/invocations/*/logs/**
            ${{ runner.temp }}/relship-native-consumer/job/validations/**
            ${{ runner.temp }}/relship-native-consumer/job/evidence/**
