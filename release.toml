schema = 4
timeout-seconds = 1200

[[targets]]
id = "linux-x86_64-gnu"

[targets.runtime]
mode = "native"

[packaging.formats]
linux = ["tar.gz", "zip"]

[[products]]
id = "relship"
directory = "."
binaries = ["relship"]
assets = [{ source = "LICENSE", path = "LICENSE" }]

[products.build]
kind = "rust"
package = "relship"
manifest = "Cargo.toml"
features = []
default-features = true
