[package]
name = "relship"
version = "0.1.0"
default-run = "relship"
edition = "2024"
rust-version = "1.96"
description = "Source-bound release planning and artifact verification for Rust, Go and CMake C CLIs"
license = "MIT"

[dependencies]
ar = "=0.9.0"
cpio = "=0.4.2"
ed25519-dalek = "=2.2.0"
getrandom = "=0.4.3"
anyhow = "=1.0.104"
clap = { version = "=4.6.7", features = ["derive"] }
console = "=0.16.6"
dialoguer = { version = "=0.12.0", default-features = false }
flate2 = "=1.1.9"
libc = "=0.2.189"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.150"
md-5 = "=0.10.6"
sha1 = "=0.10.7"
rpm = { version = "=0.30.2", default-features = false }
semver = "=1.0.27"
sha2 = "=0.10.9"
tar = "=0.4.46"
toml = "=0.8.23"
toml_edit = "=0.22.27"
wait-timeout = "=0.2.1"
zip = { version = "=8.6.0", default-features = false, features = ["deflate-flate2"] }
zstd = "=0.13.3"
ureq = { version = "=3.5.2", default-features = false, features = ["rustls"] }
percent-encoding = "=2.3.2"
log = { version = "=0.4.35", features = ["max_level_info"] }

[dev-dependencies]
rpm = { version = "=0.30.2", default-features = false, features = ["payload"] }
tempfile = "=3.27.0"

[build-dependencies]
sha2 = "=0.10.9"
